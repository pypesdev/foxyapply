name: Build

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # - os: ubuntu-latest
          #   platform: linux/amd64
          #   artifact: linux-amd64
          # - os: ubuntu-24.04-arm
          #   platform: linux/arm64
          #   artifact: linux-arm64
          - os: macos-latest
            platform: darwin/amd64,darwin/arm64
            artifact: darwin-universal
          # - os: windows-latest
          #   platform: windows/amd64
          #   artifact: windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }}

      - name: Codesign macOS app
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 -d > certificate.p12
          security create-keychain -p "$MACOS_CERTIFICATE_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CERTIFICATE_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CERTIFICATE_PWD" build.keychain
          APP="build/bin/applyfox-arm64.app"
          codesign --force --deep --options runtime --timestamp \
            -s "Developer ID Application: Jared Zwick (8K2242M5JQ)" \
            "$APP" -v
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Keep upload-artifact for non-release builds (PR artifacts, etc.)
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.artifact }}
          path: build/bin/

      # Package macOS app for release
      - name: Notarize + staple (macOS)
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/bin/applyfox-arm64.app"
          ZIP="build/bin/applyfox-arm64.zip"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          echo "=== Submitting to Apple notarization ==="
          SUBMIT_JSON="$(xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json)"

          echo "$SUBMIT_JSON"

          STATUS="$(echo "$SUBMIT_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status",""))')"
          ID="$(echo "$SUBMIT_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))')"

          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization not accepted. Status=$STATUS ID=$ID"
            if [ -n "$ID" ]; then
              echo "=== Fetching notarization log ==="
              xcrun notarytool log "$ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            exit 1
          fi

          echo "=== Stapling ticket ==="
          for i in 1 2 3 4 5; do
            if xcrun stapler staple "$APP"; then
              break
            fi
            echo "Staple attempt $i failed (CloudKit lag). Sleeping..."
            sleep $((i*10))
          done

          xcrun stapler validate "$APP"

          # Re-zip stapled app for distribution
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

          # Optional: remove .app so release only uploads zip
          rm -rf "$APP"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: build/bin/*
